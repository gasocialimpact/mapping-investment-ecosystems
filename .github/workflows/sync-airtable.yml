name: Sync Airtable Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC (1am EST)
  workflow_dispatch: {}   # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Clone CVI data for county-level enrichment
      - name: Clone CVI data
        run: git clone --depth 1 https://github.com/gasocialimpact/CVI.git ../CVI

      - name: Export Airtable data
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/export-airtable.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ecosystem.json public/icons/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ecosystem.json public/icons/
          git commit -m "chore: sync Airtable data $(date -u +%Y-%m-%d)"
          git push
