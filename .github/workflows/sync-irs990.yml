name: Sync IRS 990 Data

# The NCCS tables are refreshed roughly once a year, so this runs on demand and
# on a quarterly schedule rather than nightly. It streams ~170 MB per tax year
# from S3 and writes only public/data/irs990-georgia.json.

on:
  schedule:
    - cron: '0 7 1 1,4,7,10 *'  # 1st of Jan/Apr/Jul/Oct, 7am UTC
  workflow_dispatch:
    inputs:
      years:
        description: 'Tax years, e.g. 2020-2022 or 2019,2021 (blank = latest 3 available)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write   # to start the Pages deploy after committing data

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the concordance submodule is needed (field labels). The script
          # falls back to fetching concordance.csv from GitHub if it is absent.
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Georgia 990 extract
        env:
          IRS990_YEARS: ${{ github.event.inputs.years }}
        run: node scripts/fetch-990-data.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/irs990-georgia.json public/data/irs-bmf-georgia.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/irs990-georgia.json public/data/irs-bmf-georgia.json
          git commit -m "chore: sync IRS 990 data $(date -u +%Y-%m-%d)"
          # Another push (a person, or the other sync workflow) can land on main
          # while this job runs. Rebase our single data commit onto it and retry
          # rather than failing on a non-fast-forward push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $attempt failed, retrying"; sleep 10
          done

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages deploy must be started explicitly or the site never picks up
      # the new data.
      - name: Deploy site
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
