<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Georgia's Impact Investing Ecosystem Map</title>
    <!-- Familjen Grotesk is self-hosted; see the @font-face block in src/index.css. -->
    <!-- Start the data fetches before the JS bundle parses — matters most when
         the tool is iframe-embedded and everything loads in sequence. -->
    <link rel="preload" href="data/ecosystem.json" as="fetch" />
    <link rel="preload" href="data/place-counties.json" as="fetch" />
    <!-- Warm the map-tile connections so the basemap paints immediately. -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://c.tile.openstreetmap.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
